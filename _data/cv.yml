    Experience:
      - company: University of Trento
        position: Visiting Ph.D. Researcher
        location: Trento, Italy
        start_date: 2026-07
        end_date: 2026-12
        highlights:
          - "Video Anomaly Prediction with Localization: developing training-free methods that use multimodal LLMs to predict whether an anomaly will occur and which people will be involved."
          - Built spatio-temporal annotations by tracking involved people backward from each anomaly with SAM3, refined through shot-cut detection, cycle-consistency checks, and manual review, and added per-video captions.
          - Benchmarking multimodal LLMs as zero-shot baselines using frame-level AUC, temporal AP, and spatial AP.

      - company: École de Technologie Supérieure
        position: Machine Learning Doctoral Research Assistant
        location: Montreal, Canada
        start_date: 2022-05
        end_date: present
        highlights:
          - "Vision-Language Object Detection: proposed the first test-time adaptation method for vision-language object detectors using weighted entropy minimization and image-conditioned prompt selection."
          - Improved performance across multiple datasets by an average of 9.8 AP50 points while optimizing only 2.1% of the model parameters.
          - "Domain-Adaptive Object Detection: proposed a method for unsupervised multi-source domain adaptation in object detection utilizing prototype and attention-based methods for class-level alignment."
          - Improved performance on BDD100K by 8.1 AP50 points while reducing the number of trainable parameters by 50 million, leading to faster and more efficient computation.
          - Demonstrated robustness in handling imbalanced datasets, achieving 6.8% improvement in imbalanced settings.

      - company: GAIA, Ericsson
        position: Mitacs Accelerate Intern
        location: Montreal, Canada
        start_date: 2022-09
        end_date: 2024-03
        highlights:
          - Developed an object detection model, enabling precise identification of antennas on towers from drone footage; reduced false positives by 35% under challenging weather scenarios.
          - Trained the model in a semi-supervised setting using only 40% of the labeled data.
          - Enhanced detection accuracy by 11% mAP compared to the previous state-of-the-art method.

      - company: LIVIA Laboratory, ÉTS
        position: Artificial Intelligence Research Engineer
        location: Montreal, Canada (Remote)
        start_date: 2020-04
        end_date: 2021-08
        highlights:
          - Collaborated with a doctoral candidate to develop a progressive multi-target domain adaptation method for image classification, improving generalization across multiple target domains by up to 15%.
          - Enhanced real-time CNN applicability by reducing computational complexity by 30% while maintaining accuracy within 2% through combined knowledge distillation and unsupervised domain adaptation.
          - Achieved state-of-the-art performance on benchmark datasets, improving accuracy by 4% on the OfficeHome dataset with the compressed model.

